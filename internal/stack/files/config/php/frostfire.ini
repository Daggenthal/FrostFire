; Your PHP settings, loaded last so they win over the image defaults.

; Outbound mail goes through msmtp to the relay set in frostfire.env (SMTP_*).
sendmail_path = "/usr/bin/msmtp -t"

memory_limit        = 256M
upload_max_filesize = 64M
post_max_size       = 64M
expose_php          = Off
date.timezone       = UTC

; Uncomment to keep PHP sessions in memcached instead of on disk.
; session.save_handler = memcached
; session.save_path    = "cache:11211"
