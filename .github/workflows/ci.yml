name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"  # FreeBSD end to end, weekly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install restic
        env:
          RESTIC_VERSION: 0.18.1
        run: |
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          bunzip2 restic.bz2
          sudo install -m 755 restic /usr/local/bin/restic

      - name: Vet
        run: |
          go vet ./...
          GOOS=freebsd go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Validate compose files
        run: |
          printf 'DOMAIN=example.org\nMARIADB_ROOT_PASSWORD=x\n' > /tmp/ci.env
          for os in linux freebsd; do
            docker compose -f internal/stack/files/stack/$os/compose.yaml --env-file /tmp/ci.env config --quiet
          done

      - name: Build for Linux and FreeBSD
        run: |
          for target in linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/frostfire
          done

  # The real thing on Linux: setup, up, backup, break, restore.
  e2e-linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o frostfire ./cmd/frostfire && sudo install -m 755 frostfire /usr/local/bin/frostfire
      - name: End to end (Docker)
        run: sudo FROSTFIRE_ENGINE=docker sh ci/run-e2e.sh

  # The same test inside a real FreeBSD VM, with Podman, pf and FreeBSD-native images.
  # It runs nested inside GitHub's own VM and builds every image from scratch, which
  # takes 45+ minutes, so it runs on demand and weekly rather than on every push.
  e2e-freebsd:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: End to end (FreeBSD 15.0, Podman)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y go curl
          run: |
            set -e
            echo "::notice title=e2e FreeBSD::VM up, running unit tests"
            go test -count=1 ./...
            go build -o /usr/local/bin/frostfire ./cmd/frostfire
            echo "::notice title=e2e FreeBSD::unit tests passed, starting end to end"
            sh ci/run-e2e.sh
