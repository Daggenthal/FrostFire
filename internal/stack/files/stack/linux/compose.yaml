# Generated by frostfire. Do not edit: this file is rewritten on every `frostfire up`.
# Your own settings live in ../config and ../frostfire.env.

name: frostfire

services:
  db:
    image: docker.io/library/mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in frostfire.env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ../db:/var/lib/mysql
      - ../config/mariadb:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  cache:
    image: docker.io/library/memcached:1.6-alpine
    restart: always
    command: ["memcached", "-m", "${MEMCACHED_MB:-128}"]
    networks: [backend]

  php:
    build: ./php
    image: localhost/frostfire-php:latest
    restart: always
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ../www:/srv/www
      - ../config/php/frostfire.ini:/usr/local/etc/php/conf.d/zz-frostfire.ini:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks: [backend]

  web:
    image: docker.io/library/nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in frostfire.env}
    volumes:
      - ../www:/srv/www:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ../certs:/etc/letsencrypt:ro
      - ../acme:/srv/acme:ro
    # Run the stock entrypoint (renders templates), then reload every 6h so renewed certs get picked up.
    command:
      - /bin/sh
      - -c
      - >-
        /docker-entrypoint.sh nginx -g 'daemon off;' & pid=$$!;
        trap 'kill -QUIT $$pid' TERM INT;
        (while sleep 21600; do nginx -s reload; done) &
        wait $$pid
    depends_on: [php]
    networks: [backend]

  certbot:
    image: docker.io/certbot/certbot:latest
    restart: always
    volumes:
      - ../certs:/etc/letsencrypt
      - ../acme:/srv/acme
    # Tries to renew twice a day. Does nothing until `frostfire certs issue` has created a cert.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM INT;
        while :; do certbot renew --quiet --webroot -w /srv/acme; sleep 12h & wait $$!; done

networks:
  backend: {}
