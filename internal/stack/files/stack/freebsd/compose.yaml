# Generated by frostfire. Do not edit: this file is rewritten on every `frostfire up`.
# FreeBSD stack: same services, mount points and network names as the Linux stack,
# but every image is built locally from FreeBSD's own freebsd-runtime base
# (`frostfire up` builds them first, with --no-hosts, which pkg needs inside jails).
#
# Differences from Linux:
#   - No healthchecks: Podman on FreeBSD has no systemd timers to run them.
#     frostfire waits for MariaDB itself, and PHP reconnects on its own.
#   - Containers are jails, and all of them run as root (a FreeBSD jail requirement).

name: frostfire

services:
  db:
    image: localhost/frostfire-db:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in frostfire.env}
    volumes:
      - ../db:/var/db/mysql
      - ../config/mariadb:/frostfire/mariadb:ro
    networks: [backend]

  cache:
    image: localhost/frostfire-cache:latest
    restart: always
    command: ["/usr/local/bin/memcached", "-u", "nobody", "-m", "${MEMCACHED_MB:-128}"]
    networks: [backend]

  php:
    image: localhost/frostfire-php:latest
    restart: always
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ../www:/srv/www
      - ../config/php/frostfire.ini:/usr/local/etc/php/zz-frostfire.ini:ro
    depends_on: [db, cache]
    networks: [backend]

  web:
    image: localhost/frostfire-web:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in frostfire.env}
    volumes:
      - ../www:/srv/www:ro
      - ./nginx/templates:/frostfire/templates:ro
      - ../certs:/etc/letsencrypt:ro
      - ../acme:/srv/acme:ro
    depends_on: [php]
    networks: [backend]

  certbot:
    image: localhost/frostfire-certbot:latest
    restart: always
    volumes:
      - ../certs:/etc/letsencrypt
      - ../acme:/srv/acme
    # Tries to renew twice a day. Does nothing until `frostfire certs issue` has created a cert.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM INT;
        while :; do certbot renew --quiet --webroot -w /srv/acme; sleep 43200 & wait $$!; done

networks:
  backend: {}
